

<div class="user_container">
  <div class="bg_img" *ngIf="pages[1] || pages[2]"><img src="../../assets/img/teslaEVSE.svg" alt="aether ev img"></div>
  <div class="banner">
    <h1>{{page_title}}</h1>
    <button type="button" class="btn btn-primary" (click)="addUser()" *ngIf="pages[0]">Add User</button>
  </div>

  <div class="page1" *ngIf="pages[0]">
    <div class="card" *ngFor="let user of users">
      <div class="card-body">
        <div class="left">
          <p>User ID: {{user.user_id}}</p>
          <h5>{{user.user_firstname}} {{user.user_lastname}}</h5>
          <p>{{user.user_phone}}</p>
          <p>{{user.user_email}}</p>
          <p class="card-text">{{user.user_address}}</p>
        </div>
        <div class="right">
          <div>
            <div>
              <p class="card-text">DOB: {{user.user_DOB | date:'dd-MM-YYYY'}}</p>
              <p class="card-text">License: {{user.user_license}}</p>
            </div>
           <h5>Credits {{user.user_credits}}</h5>
          </div>
         <div class="options">
          <span class="material-icons edit" (click)="update(user.user_id)">
            edit
          </span>
          <span class="material-icons delete" (click)="delete(user.user_id)">
            delete
          </span>
        </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page2" *ngIf="pages[1] || pages[2]" [formGroup]="userForm">
    <h4 *ngIf="pages[2]">User ID: {{user_id}}</h4>
    <form>
      <div>
        <label for="user_firstname">First Name</label>
        <input type="text" formControlName="user_firstname" id="user_firstname" (keypress)="keyPressAlpha($event)">
        <label for="user_lastname">Last Name</label>
        <input type="text" formControlName="user_lastname" id="user_lastname" (keypress)="keyPressAlpha($event)">
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="text" formControlName="user_phone" id="phone" (keypress)="keyPressNumbers($event)" (focusout)="validate(userForm.get('user_phone').invalid, 'Invalid phone number')">
        <label for="email">Email</label>
        <input type="text" formControlName="user_email" id="email" (focusout)="validate(userForm.get('user_email').invalid, 'Invalid email')">
      </div>
      <div class="d-flex address">
        <label for="address">Address</label>
        <input type="text" formControlName="user_address" id="address">
      </div>
      <div>
        <label for="user_DOB">Date of Birth</label>
        <input type="date" formControlName="user_DOB" id="user_DOB">
        <label for="user_license">License</label>
        <input type="text" formControlName="user_license" id="user_license">
      </div>
      <div>
        <label for="user_credits">Credits</label>
        <input type="text" formControlName="user_credits" id="user_credits" (keypress)="keyPressNumbers($event)" (focusout)="validate(userForm.get('user_credits').invalid, 'Credit should be under 999')">
      </div>
      <div class="buttons">
        <button type="button" class="btn btn-primary" (click)="confirmUser(userForm.value)" *ngIf="pages[1]" [disabled]="!userForm.valid">Add</button>
        <button type="button" class="btn btn-primary" (click)="updateUser(userForm.value)" *ngIf="pages[2]" [disabled]="!userForm.valid">Update</button>
        <button type="button" class="btn btn-primary btn2" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>

</div>
