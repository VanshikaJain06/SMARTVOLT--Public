<div class="container content_wrapper">
  <h1>{{welcome}}</h1>

  <form>
    <div class="page1" *ngIf="pages[0]">
      <label for="role" class="mt-4">What role do you play?</label>
      <div class="role" id="role">
        <button type="button" class="btn btn-primary" (click)="iAmUser('user')">User</button>
        <button type="button" class="btn btn-primary" (click)="iAmCompany('company')">Company</button>
      </div>
    </div>

    <div class="page2" *ngIf="pages[1]" [formGroup]="userRegistrationForm">
      <label class="mb-4">Let's get you started!</label>
      <div>
        <label for="user_firstname">First Name</label>
        <input type="text" formControlName="user_firstname" id="user_firstname" (keypress)="keyPressAlpha($event)">
        <label for="user_lastname">Last Name</label>
        <input type="text" formControlName="user_lastname" id="user_lastname" (keypress)="keyPressAlpha($event)">
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="text" formControlName="user_phone" id="phone" (keypress)="keyPressNumbers($event)" (focusout)="validate(userRegistrationForm.get('user_phone').invalid, 'Invalid phone number')">
        <label for="email">Email</label>
        <input type="text" formControlName="user_email" id="email" (focusout)="validate(userRegistrationForm.get('user_email').invalid, 'Invalid email')">
      </div>
      <div class="d-flex address">
        <label for="address">Address</label>
        <input type="text" formControlName="user_address" id="address">
      </div>
      <div>
        <label for="user_DOB">Date of Birth</label>
        <input type="date" formControlName="user_DOB" id="user_DOB">
        <label for="user_license">License</label>
        <input type="text" formControlName="user_license" id="user_license">
      </div>
      <button [disabled]="!userRegistrationForm.valid" type="button" class="btn btn-primary" (click)="register(userRegistrationForm.value)">Submit</button>
    </div>

    <div class="page3" *ngIf="pages[2]" [formGroup]="companyRegistrationForm">
      <label class="mb-4">Let's get you started!</label>
      <div>
        <label for="com_name">Company Name</label>
        <input type="text" formControlName="com_name" id="com_name" (keypress)="keyPressAlpha($event)">
      </div>
      <div>
        <label for="com_phone">Phone</label>
        <input type="text" formControlName="com_phone" id="com_phone" (keypress)="keyPressNumbers($event)" (focusout)="validate(companyRegistrationForm.get('com_phone').invalid, 'Invalid phone number')">
        <label for="com_email">Email</label>
        <input type="text" formControlName="com_email" id="com_email" (focusout)="validate(companyRegistrationForm.get('com_email').invalid, 'Invalid email')">
      </div>
      <div class="d-flex address">
        <label for="com_address">Address</label>
        <input type="text" formControlName="com_address" id="com_address">
      </div>
      <button [disabled]="!companyRegistrationForm.valid" type="button" class="btn btn-primary" (click)="register(companyRegistrationForm.value)">Submit</button>
    </div>
  </form>

</div>
